name: poidem

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-poidem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-poidem}
      POSTGRES_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

  migrate:
    image: migrate/migrate:v4.19.1
    environment:
      PGUSER: ${POSTGRES_USER:-poidem}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-poidem}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://db:5432?sslmode=disable"]
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poidem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-poidem}
      # Defaults for psql inside the container.
      PGUSER: ${POSTGRES_USER:-poidem}
      PGDATABASE: ${POSTGRES_DB:-poidem}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
